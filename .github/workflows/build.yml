name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project files
        run: |
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'EOF0'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.kaizen.desk"
              compileSdk = 34
              defaultConfig { applicationId = "com.kaizen.desk"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "0.1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.13.1") }
          EOF0
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'EOF1'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:label="Kaizen Desk" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:resizeableActivity="true" android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF1
          mkdir -p "$(dirname app/src/main/java/com/kaizen/desk/Freeform.kt)"
          cat > app/src/main/java/com/kaizen/desk/Freeform.kt <<'EOF2'
          package com.kaizen.desk
          
          import android.app.ActivityOptions
          import android.content.Context
          import android.content.Intent
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.util.DisplayMetrics
          import android.view.Display
          
          /** Opens apps as floating (freeform) windows, preferring an external display. */
          object Freeform {
              private var count = 0
          
              fun targetDisplay(ctx: Context): Display {
                  val dm = ctx.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  return dm.displays.firstOrNull { it.displayId != Display.DEFAULT_DISPLAY }
                      ?: dm.getDisplay(Display.DEFAULT_DISPLAY)
              }
          
              fun launch(ctx: Context, pkg: String) {
                  val intent = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_MULTIPLE_TASK)
                  val d = targetDisplay(ctx)
                  val m = DisplayMetrics().also { d.getRealMetrics(it) }
                  val w = (m.widthPixels * 0.6).toInt()
                  val h = (m.heightPixels * 0.65).toInt()
                  val off = (count++ % 6) * 80 + 60
                  val opts = ActivityOptions.makeBasic()
                      .setLaunchDisplayId(d.displayId)
                      .setLaunchBounds(Rect(off, off, off + w, off + h))
                  // Hidden API: windowing mode 5 = freeform. Silently ignored if blocked.
                  runCatching {
                      ActivityOptions::class.java.getMethod("setLaunchWindowingMode", Int::class.javaPrimitiveType)
                          .invoke(opts, 5)
                  }
                  ctx.startActivity(intent, opts.toBundle())
              }
          }
          EOF2
          mkdir -p "$(dirname app/src/main/java/com/kaizen/desk/MainActivity.kt)"
          cat > app/src/main/java/com/kaizen/desk/MainActivity.kt <<'EOF3'
          package com.kaizen.desk
          
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.graphics.Color
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          
          class MainActivity : Activity() {
              private lateinit var grid: GridView
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setBackgroundColor(Color.parseColor("#0b0b10")) }
          
                  grid = GridView(this).apply {
                      numColumns = GridView.AUTO_FIT; columnWidth = dp(96); stretchMode = GridView.STRETCH_COLUMN_WIDTH
                      verticalSpacing = dp(12); setPadding(dp(16), dp(24), dp(16), dp(8))
                      adapter = AppAdapter(loadApps())
                      setOnItemClickListener { _, _, i, _ ->
                          Freeform.launch(this@MainActivity, (adapter.getItem(i) as ResolveInfo).activityInfo.packageName)
                      }
                  }
                  root.addView(grid, LinearLayout.LayoutParams(-1, 0, 1f))
          
                  val bar = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL; setBackgroundColor(Color.parseColor("#16161f")); setPadding(dp(12), 0, dp(12), 0) }
                  val start = TextView(this).apply {
                      text = "改善  Start"; setTextColor(Color.WHITE); textSize = 16f
                      setOnClickListener { grid.visibility = if (grid.visibility == View.VISIBLE) View.INVISIBLE else View.VISIBLE }
                  }
                  bar.addView(start, LinearLayout.LayoutParams(0, -1, 1f))
                  bar.addView(TextClock(this).apply { setTextColor(Color.WHITE); format12Hour = "h:mm a"; format24Hour = "HH:mm" })
                  root.addView(bar, LinearLayout.LayoutParams(-1, dp(52)))
                  setContentView(root)
              }
          
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          
              private fun loadApps(): List<ResolveInfo> {
                  val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return packageManager.queryIntentActivities(i, 0)
                      .filter { it.activityInfo.packageName != packageName }
                      .sortedBy { it.loadLabel(packageManager).toString().lowercase() }
              }
          
              inner class AppAdapter(private val apps: List<ResolveInfo>) : BaseAdapter() {
                  override fun getCount() = apps.size
                  override fun getItem(p: Int) = apps[p]
                  override fun getItemId(p: Int) = p.toLong()
                  override fun getView(p: Int, v: View?, parent: ViewGroup?): View {
                      val a = apps[p]
                      return LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                          addView(ImageView(context).apply { setImageDrawable(a.loadIcon(packageManager)) }, LinearLayout.LayoutParams(dp(48), dp(48)))
                          addView(TextView(context).apply {
                              text = a.loadLabel(packageManager); setTextColor(Color.WHITE); textSize = 12f
                              maxLines = 1; gravity = Gravity.CENTER; ellipsize = android.text.TextUtils.TruncateAt.END
                          })
                      }
                  }
              }
          }
          EOF3
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'EOF4'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF4
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'EOF5'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF5
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'EOF6'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "KaizenDesk"
          include(":app")
          EOF6
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KaizenDesk-apk
          path: app/build/outputs/apk/debug/*.apk
